font-family = "MonaspiceNe Nerd Font"
font-size = 14
font-ligatures = "calt"
font-blending = "macos-like"
adjust-cell-height = 0

theme = "Catppuccin Macchiato"
theme-dark = "catppuccin-macchiato"

# term = "auto" (reset to default)
# kitty-keyboard = true (reset to default)
macos-option-as-alt = "left"
# shift-arrow-select = true (reset to default)
# mouse-reporting = true (reset to default)

# window-layout = "sidebar-left" (reset to default)
# sidebar-visible = true (reset to default)
# sidebar-width = 244 (reset to default)
details-panel-width = 230

# working-directory = "inherit" (reset to default)
# window-working-directory = "home" (reset to default)
# tab-working-directory = "inherit" (reset to default)
# split-working-directory = "inherit" (reset to default)

on-launch = "new_window"
session-restore-banner = false
# session-restore-processes = "none" (reset to default)
# privilege-resume-agent-session = true (reset to default)

scrollback-lines = 100000
session-log-size-mb = 20
# session-log-mode = "redacted" (reset to default)

# shell-integration = true (reset to default)
# ssh-integration = true (reset to default)
# omit-otty-prefix = false (reset to default)
# cli-allow-overwrite = false (reset to default)

autocomplete-inline-suggestion = false
autocomplete-shortcut = "ctrl+space"
autocomplete-show-candidates = "option-escape"
# autocomplete-on-device-learning = true (reset to default)
# autocomplete-history-ignore = "ssh *" (reset to default)
# autocomplete-history-ignore = "export *TOKEN*" (reset to default)
# autocomplete-history-ignore = "export *KEY*" (reset to default)
# autocomplete-history-ignore = "*--password *" (reset to default)
# autocomplete-history-ignore = "*--token *" (reset to default)

# notification-foreground = "off" (reset to default)
# privilege-sound-on-error = false (reset to default)
privilege-sound-shell = false
# privilege-notification-on-finish = false (reset to default)
privilege-notification-on-error = false
privilege-notification-on-watch-finish = false
# privilege-notification-shell = false (reset to default)

# privilege-badge-exit-status = true (reset to default)
# privilege-badge-activity = false (reset to default)
# privilege-badge-agent-processing = true (reset to default)
# privilege-badge-agent-task-complete = true (reset to default)
# privilege-badge-agent-awaiting-input = true (reset to default)

# privilege-notify-agent-task-complete = false (reset to default)
# privilege-notify-agent-awaiting-input = false (reset to default)
# privilege-caffeinate-agent-processing = false (reset to default)

# show-auto-approve = false (reset to default)
# auto-approve-enabled = false (reset to default)
# ipc-allow-send-keys = false (reset to default)
# ipc-allow-sensitive-sessions = false (reset to default)

file-open-with = "otty"
folder-open-with = "otty"
# link-open-with = "browser" (reset to default)

# editor-line-wrap = false (reset to default)
editor-tab-size = 2
# editor-visible-whitespace = false (reset to default)
# editor-show-line-numbers = true (reset to default)
# editor-default-to-preview-readonly = true (reset to default)
# editor-scroll-past-end = true (reset to default)

# confirm-close-tab = "process" (reset to default)
# confirm-close-pane = "process" (reset to default)
# confirm-close-window = "process" (reset to default)
new-tab-position = "after-current"

foreground = "#cad3f5"
background = "#24273a"
palette-0 = "#494d64"
